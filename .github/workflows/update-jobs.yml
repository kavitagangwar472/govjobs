name: Update jobs
on:
  # Scheduled run switched off: the daily update now runs from your PC (run_daily.bat).
  # To turn it back on, remove the # signs on the next two lines.
  # schedule:
  #   - cron: "30 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/scraper.py
      - name: Commit changes
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || (git commit -m "Update jobs" && git push)
